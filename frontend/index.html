    <title>TRUSTID — Secure Digital Document &amp; Identity Screening System</title>
    <script>
      // Clear any stale Service Workers or caches from previous projects on this port
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let r of registrations) {
            r.unregister();
            console.log('[TRUSTID] Stale ServiceWorker unregistered:', r);
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let n of names) {
            caches.delete(n);
            console.log('[TRUSTID] Stale cache cleared:', n);
          }
        });
      }
    </script>
